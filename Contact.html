  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    const foucGuard =
      '<style>html.__orca-boot{background:#2f3b2f !important}' +
      'html.__orca-boot body{visibility:hidden !important}</' + 'style>' +
      '<script>(function(){' +
      'var h=document.documentElement,done=false;' +
      'h.classList.add("__orca-boot");document.addEventListener("click",function(ev){var b=ev.target&&ev.target.closest?ev.target.closest(".orca-send"):null;if(!b)return;ev.preventDefault();var g=function(c){var el=document.querySelector("."+c);return el&&el.value?el.value.trim():"";};var W={de:["Name","E-Mail","Fahrzeug","Nachricht","Bitte E-Mail und Nachricht angeben.","Wird gesendet \u2026","Vielen Dank, Ihre Nachricht ist unterwegs.","Senden nicht m\u00f6glich. Bitte schreiben Sie an info@orca.gmbh.","Anfrage \u00fcber die Website"],en:["Name","Email","Vehicle","Message","Please provide your email and a message.","Sending \u2026","Thank you, your message is on its way.","Sending failed. Please write to info@orca.gmbh.","Enquiry via the website"],fr:["Nom","E-mail","V\u00e9hicule","Message","Merci d\u2019indiquer votre e-mail et un message.","Envoi \u2026","Merci, votre message est en route.","\u00c9chec de l\u2019envoi. Merci d\u2019\u00e9crire \u00e0 info@orca.gmbh.","Demande via le site"]};var L=(document.documentElement.getAttribute("lang")||"de").substring(0,2);var t=W[L]||W.de;var st=document.querySelector(".orca-status");var sag=function(s,ok){if(!st)return;st.textContent=s;st.style.color=ok===false?"#7a2331":"";};var n=g("orca-f-name"),m=g("orca-f-email"),v=g("orca-f-vehicle"),x=g("orca-f-message");if(!m||!x){sag(t[4],false);var f=document.querySelector(m?".orca-f-message":".orca-f-email");if(f)f.focus();return;}var hp=document.querySelector(".orca-f-hp");if(hp&&hp.value){return;}var d={name:n,email:m,fahrzeug:v,nachricht:x,sprache:L,betreff:t[8]};b.disabled=true;sag(t[5],true);fetch("https://www.orca.gmbh/kontakt.php",{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(d)}).then(function(r){return r.text().then(function(tx){return {ok:r.ok,st:r.status,tx:tx};});}).then(function(a){var j=null;try{j=JSON.parse(a.tx);}catch(e){}if(!a.ok||!j||!j.ok)throw new Error(j&&j.fehler?j.fehler:"HTTP "+a.st);sag(t[6],true);["orca-f-name","orca-f-email","orca-f-vehicle","orca-f-message"].forEach(function(c){var el=document.querySelector("."+c);if(el)el.value="";});b.disabled=false;}).catch(function(e){sag(t[7]+" ("+((e&&e.message)||"Verbindung")+")",false);b.disabled=false;});},true);document.addEventListener("click",function(ev){var nv=document.querySelector("nav");if(!nv)return;var t=ev.target;if(!t||!t.closest)return;var b=t.closest(".orca-burger");if(b){ev.preventDefault();var o=nv.classList.toggle("orca-open");b.setAttribute("aria-expanded",o?"true":"false");return;}if(nv.classList.contains("orca-open")&&!t.closest("nav")){nv.classList.remove("orca-open");var s=nv.querySelector(".orca-burger");if(s)s.setAttribute("aria-expanded","false");}},true);document.addEventListener("keydown",function(ev){if(ev.key!=="Escape")return;var nv=document.querySelector("nav");if(!nv||!nv.classList.contains("orca-open"))return;nv.classList.remove("orca-open");var s=nv.querySelector(".orca-burger");if(s){s.setAttribute("aria-expanded","false");s.focus();}});' +
      'function reveal(){if(done)return;done=true;h.classList.remove("__orca-boot");}' +
      'function ready(){var b=document.body;' +
      'return b&&b.firstElementChild&&b.textContent.indexOf("{{")===-1;}' +
      'function tick(){if(done)return;if(ready())return reveal();' +
      'requestAnimationFrame(tick);}' +
      'requestAnimationFrame(tick);' +
      'setTimeout(reveal,3000);' +
      '})();</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + foucGuard + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ormat('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"adc8ded1-0ef9-4d10-9dbb-b702fe571c78\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"6169d819-85b6-4d7f-b608-504f4c7b4561\"><\u002Fscript>\n<style>\n  body { margin: 0; background: {{ bg }}; }\n  .nav-link, .logo-link, .lang-switch, .link-fade { transition: color 0.2s ease, border-color 0.2s ease; }\n  a { text-decoration: none; }\n  .field { width: 100%; box-sizing: border-box; padding: 12px 0; border: none; border-bottom: 1px solid {{ line }}; background: transparent; font-family: 'Manrope', sans-serif; font-size: 15px; color: {{ text }}; outline: none; }\n  .field::placeholder { color: {{ textMuted }}; }\n\n  /* ORCA responsive */\n  @media (max-width: 820px) {\n    /* Kopfzeile bleibt einzeilig: Logo links, Sprachen und\n       Menue-Schaltflaeche rechts. Der Umbruch von vorher entfaellt,\n       weil die Menuepunkte in die Klappflaeche gewandert sind. */\n    header { padding: 14px 22px !important; flex-wrap: nowrap !important;\n             gap: 14px !important; }\n    /* Bezugspunkt fuer die Klappflaeche. Bewusst ohne !important: Die\n       Kopfzeile der Startseite traegt inline position:absolute und\n       liegt dadurch weiter ueber dem Video — mit !important wuerde\n       sie in den Textfluss zurueckfallen und den Hero nach unten\n       schieben. Ein Bezugspunkt ist sie als absolute ohnehin. */\n    header { position: relative; }\n    /* Der Firmenname darf schrumpfen und umbrechen, damit rechts\n       genug Platz bleibt; inline stand dort nowrap und\n       flex-shrink:0. */\n    header > a.logo-link { font-size: 14px !important;\n                          white-space: normal !important;\n                          line-height: 1.25 !important;\n                          flex-shrink: 1 !important;\n                          min-width: 0 !important; }\n    nav { gap: 8px !important; flex-wrap: nowrap !important;\n          flex-shrink: 0 !important; }\n    .orca-navlinks { display: none !important; }\n    .orca-burger { display: flex !important; }\n    /* Ohne die Menuepunkte daneben trennt der Strich nichts mehr. */\n    .orca-langs { gap: 2px !important; border-left: 0 !important;\n                  padding-left: 0 !important; }\n    /* Aufgeklappt: volle Breite unter der Kopfzeile. */\n    nav.orca-open .orca-navlinks { display: flex !important;\n                                   flex-direction: column !important;\n                                   align-items: stretch !important;\n                                   gap: 0 !important;\n                                   position: absolute;\n                                   top: 100%; left: 0; right: 0;\n                                   z-index: 30;\n                                   background: #f6f3ee;\n                                   border-top: 1px solid #ddd7cc;\n                                   border-bottom: 1px solid #ddd7cc;\n                                   padding: 6px 22px 12px;\n                                   box-sizing: border-box; }\n    nav.orca-open .orca-navlinks a.nav-link {\n        min-height: 50px !important; font-size: 12px !important;\n        border-bottom: 0 !important; padding: 0 0 0 14px !important; }\n    /* Die aktuelle Seite ist im Export durch border-bottom im\n       style-Attribut markiert. Untereinander wirkt eine Unterkante\n       wie eine Trennlinie, deshalb wandert die Markierung an die\n       linke Seite. Der Selektor greift auf den Namen der\n       Eigenschaft zu, den die rendernde Schicht unveraendert\n       uebernimmt — anders als den Wert, in den sie Leerzeichen\n       einfuegt. */\n    nav.orca-open .orca-navlinks a.nav-link[style*=\"border-bottom\"] {\n        border-left: 2px solid currentColor !important;\n        padding-left: 12px !important; }\n    section { padding-left: 22px !important; padding-right: 22px !important; }\n    footer { padding-left: 22px !important; padding-right: 22px !important; gap: 14px 26px !important; }\n    /* Alle mehrspaltigen Raster untereinander. Bewusst als Flex-Spalte\n       und nicht als einspaltiges Raster: Die Zeilenhoehe wurde dort\n       allein aus dem Bild abgeleitet, Name und Rolle darunter zaehlten\n       nicht mit und ragten 70px in die naechste Zeile — die Rolle des\n       ersten Geschaeftsfuehrers verschwand hinter dem zweiten Bild.\n       Zugleich wurde aspect-ratio gegen die alte, breitere Spalte\n       aufgeloest, wodurch die Bilder 265 statt 195px hoch waren. Als\n       Flex-Spalte stimmen beide Werte, und gap bleibt erhalten — bei\n       display:block waeren die Abstaende verloren gegangen. */\n    [style*=\"grid-template-columns\"] { display: flex !important; flex-direction: column !important; }\n    /* Inhalte in einspaltigen Rastern mittig und nie breiter als die Zelle. */\n    image-slot, video, img { max-width: 100% !important; }\n    /* Hero: Text und Schaltflaeche an den Seitenrand. */\n    .orca-hero-text { left: 22px !important; right: 22px !important; }\n    /* Hero flacher. Ein 16:9-Video wird in einem hochformatigen Fenster\n       bei object-fit:cover stark seitlich beschnitten — bei 100vh gehen\n       rund drei Viertel der Bildbreite verloren. Flacher heisst mehr\n       sichtbare Breite und weniger Videowand. */\n    /* Kein Seitenabstand am Hero: Er ist randlos, und weil er\n       width:100% ohne border-box traegt, kaemen die 22px oben drauf —\n       die Seite liess sich dadurch 44px seitlich verschieben. */\n    .orca-hero { height: 74vh !important; min-height: 500px !important;\n                 padding-left: 0 !important; padding-right: 0 !important; }\n    /* Innenabstand des Kennzahlen-Rasters zuruecknehmen, sonst bleiben\n       von 346px nur 234px fuer den Inhalt. */\n    .orca-stats { padding-left: 0 !important; padding-right: 0 !important; }\n    /* Detailansicht der Projekte. Einspaltig stehen Bild und Text\n       untereinander und werden zusammen hoeher als der Dialog. Der\n       hatte overflow:hidden, die Textspalte zugleich eine eigene\n       Scrollflaeche mit max-height:86vh — der Text war dadurch\n       abgeschnitten und nicht erreichbar. Jetzt scrollt der Dialog\n       als Ganzes, und die Textspalte gibt ihre Scrollflaeche ab. */\n    /* Gescrollt wird die Flaeche hinter dem Dialog, nicht der Dialog\n       selbst. Damit entfaellt jede Hoehenangabe in vh — und genau\n       daran scheiterte der erste Versuch: Auf dem iPhone meint 100vh\n       das Fenster ohne Adressleiste, ist also groesser als das\n       tatsaechlich Sichtbare. Der Dialog passte rechnerisch in seine\n       Begrenzung, hatte deshalb nichts zu scrollen, ragte aber unter\n       die Browserleiste. Die Hintergrundflaeche ist position:fixed und\n       damit immer genau so hoch wie der sichtbare Bereich. */\n    .orca-modal-overlay { padding: 14px !important; align-items: flex-start !important;\n                          overflow-y: auto !important;\n                          -webkit-overflow-scrolling: touch !important; }\n    .orca-modal { max-height: none !important; overflow: visible !important; }\n    .orca-modal-media { min-height: 210px !important; }\n    .orca-modal-text { padding: 26px 22px 34px !important;\n                       overflow-y: visible !important; max-height: none !important; }\n    /* Schliessen bleibt sichtbar, statt beim Scrollen wegzuwandern. */\n    .orca-modal-close { position: fixed !important; top: 22px !important;\n                        right: 22px !important; z-index: 2 !important; }\n    /* Antippflaechen. Die Sprachumschalter waren 15x14 Pixel gross —\n       empfohlen sind mindestens 44x44 Punkte, darunter trifft man sie\n       mit dem Finger nicht verlaesslich. 40x40 plus Abstand kommt dem\n       nahe und laesst neben dem Firmennamen noch Platz; die Schrift\n       waechst von 10 auf 14 Pixel. */\n    nav a.lang-switch { min-width: 40px !important; min-height: 40px !important;\n                        display: inline-flex !important;\n                        align-items: center !important;\n                        justify-content: center !important;\n                        font-size: 14px !important; }\n    nav a.nav-link { display: inline-flex !important;\n                     align-items: center !important; }\n    /* Die Schraegstriche zwischen den Sprachen entfallen: Mit 40px\n       breiten Feldern sind die Kuerzel ohnehin klar getrennt, und die\n       Striche wirkten zwischen den groesseren Flaechen verloren. */\n    nav a.lang-switch + span { display: none !important; }\n    /* Die Markierung der aktuellen Sprache sitzt am Text und nicht am\n       unteren Rand der 40 Pixel hohen Antippflaeche — dort stand sie\n       13 Pixel unter der Schrift und wirkte losgeloest. */\n    a.lang-switch.is-active { border-bottom: 0 !important;\n                              padding-bottom: 0 !important;\n                              text-decoration: underline !important;\n                              text-underline-offset: 5px !important; }\n    h1 { white-space: normal !important; }\n    #orca-cookie-banner { padding: 16px 18px !important; }\n  }\n  /* Die aktive Sprache wird unterstrichen wie der aktive Menuepunkt.\n     Vorher unterschied sie sich nur durch Transparenz, was bei dieser\n     Schriftgroesse kaum zu erkennen ist. */\n  a.lang-switch.is-active { border-bottom: 1px solid currentColor;\n                            padding-bottom: 2px; }\n  /* Reserve fuer die Kopfzeile im mittleren Bereich. Die franzoesische\n     Navigation ist mit 440px die breiteste (deutsch 431, englisch 411),\n     bei 821px Fensterbreite blieben ihr nur 15px Reserve. Das genuegt,\n     damit sie umbricht, solange die Schrift noch laedt und die\n     Ersatzschrift breiter ausfaellt. Mit kleinerem Abstand sind es\n     rund 40px, und alle drei Sprachen verhalten sich gleich. */\n  @media (min-width: 821px) and (max-width: 1080px) {\n    header { padding-left: 32px !important; padding-right: 32px !important; }\n    nav { gap: 16px !important; }\n  }\n  /* Geschaeftsfuehrung: Die Rasterzeile wurde allein aus dem Bild\n     abgeleitet, Name und Rolle darunter zaehlten nicht mit und ragten\n     70px heraus — auf dem Handy hinter das naechste Bild, auf dem\n     Desktop in den Abstand darunter. Mit align-items:start wird die\n     Zelle nicht mehr auf die falsch berechnete Zeilenhoehe gedehnt,\n     sondern richtet sich nach ihrem Inhalt; das Bild loest dadurch\n     auch sein Seitenverhaeltnis korrekt auf (217 statt 287px).\n     Bewusst nur hier und nicht fuer alle Raster: andere richten ihren\n     Inhalt absichtlich mittig aus. */\n  .orca-leads { align-items: start; }\n  @media (max-width: 820px) {\n    /* Als Flex-Spalte muessen die Zellen wieder volle Breite haben. */\n    .orca-leads { align-items: stretch !important; }\n  }\n<\u002Fstyle>\n\n\n<div style=\"background:{{ bg }}; color:{{ text }}; font-family:'Manrope',sans-serif; min-height:100vh;\">\n\n  <header style=\"display:flex; align-items:center; justify-content:space-between; padding:26px 56px; border-bottom:1px solid {{ line }}; gap:32px;\">\n    <a href=\"./\" style=\"font-family:'Cormorant Garamond',serif; font-size:18px; letter-spacing:0.08em; color:{{ text }}; font-weight:500; flex-shrink:0; white-space:nowrap;\" class=\"logo-link\" style-hover=\"color:{{ accent }}\">ORCA Restoration GmbH<\u002Fa>\n    <nav style=\"display:flex; align-items:center; gap:24px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; flex-wrap:nowrap; white-space:nowrap; flex-shrink:0;\">\n      <div class=\"orca-navlinks\" style=\"display:flex; align-items:center; gap:24px;\">\n      <a href=\"./\" class=\"nav-link\" style=\"color:{{ text }}; flex-shrink:0;\" style-hover=\"color:{{ accent }}\">{{ t.navStart }}<\u002Fa>\n      <a href=\"./About.html\" class=\"nav-link\" style=\"color:{{ text }}; flex-shrink:0;\" style-hover=\"color:{{ accent }}\">{{ t.navAbout }}<\u002Fa>\n      <a href=\"./Projects.html\" class=\"nav-link\" style=\"color:{{ text }}; flex-shrink:0;\" style-hover=\"color:{{ accent }}\">{{ t.navProjects }}<\u002Fa>\n      <a href=\"./Contact.html\" class=\"nav-link\" style=\"color:{{ text }}; border-bottom:1px solid {{ accent }}; padding-bottom:4px; flex-shrink:0;\" style-hover=\"color:{{ accent }}\">{{ t.navContact }}<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"orca-langs\" style=\"display:flex; align-items:center; gap:8px; border-left:1px solid {{ line }}; padding-left:20px; flex-shrink:0;\">\n        <a href=\"./Contact.html\" class=\"lang-switch is-active\" style=\"color:{{ langDeColor }};\">DE<\u002Fa>\n        <span style=\"color:{{ line }};\">/<\u002Fspan>\n        <a href=\"./en/Contact.html\" class=\"lang-switch\" style=\"color:{{ langEnColor }};\">EN<\u002Fa>\n        <span style=\"color:{{ line }};\">/<\u002Fspan>\n        <a href=\"./fr/Contact.html\" class=\"lang-switch\" style=\"color:{{ langFrColor }};\">FR<\u002Fa>\n      <\u002Fdiv>\n      <button type=\"button\" class=\"orca-burger\" aria-label=\"Menü\" aria-expanded=\"false\" style=\"display:none; flex-direction:column; justify-content:center; align-items:center; gap:5px; width:40px; height:40px; padding:0; margin:0; border:0; background:none; color:{{ text }}; cursor:pointer; flex-shrink:0;\"><span style=\"display:block; width:22px; height:2px; background:currentColor;\"><\u002Fspan><span style=\"display:block; width:22px; height:2px; background:currentColor;\"><\u002Fspan><span style=\"display:block; width:22px; height:2px; background:currentColor;\"><\u002Fspan><\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"padding:100px 56px 60px; max-width:900px; margin:0 auto; text-align:center;\">\n    <span style=\"font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:{{ accent }};\">{{ t.navContact }}<\u002Fspan>\n    <h1 style=\"font-family:'Cormorant Garamond',serif; font-weight:400; font-size:46px; margin:14px 0 0;\">{{ t.pageTitle }}<\u002Fh1>\n  <\u002Fsection>\n\n  <section style=\"max-width:1100px; margin:0 auto; padding:0 56px 120px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:80px;\">\n    <div style=\"display:flex; flex-direction:column; gap:22px;\">\n      <input class=\"field orca-f-name\" type=\"text\" placeholder=\"{{ t.fName }}\">\n      <input class=\"field orca-f-email\" type=\"email\" placeholder=\"{{ t.fEmail }}\">\n      <input class=\"field orca-f-vehicle\" type=\"text\" placeholder=\"{{ t.fVehicle }}\">\n      <textarea class=\"field orca-f-message\" rows=\"4\" placeholder=\"{{ t.fMessage }}\" style=\"resize:vertical;\"><\u002Ftextarea>\n      <input class=\"orca-f-hp\" type=\"text\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"position:absolute; left:-9999px; width:1px; height:1px; opacity:0;\">\n      <button type=\"button\" class=\"orca-send\" style=\"margin-top:10px; align-self:flex-start; padding:14px 34px; border:1px solid {{ text }}; background:transparent; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:{{ text }}; cursor:pointer; font-family:'Manrope',sans-serif;\">{{ t.fSend }}<\u002Fbutton>\n      <div class=\"orca-status\" role=\"status\" style=\"font-size:14px; line-height:1.6; min-height:22px; color:{{ textMuted }};\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:28px;\">\n      <div>\n        <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:{{ accent }}; margin-bottom:8px;\">{{ t.lAddress }}<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.7; color:{{ textMuted }};\">ORCA Restoration GmbH<br>Robert-Bosch-Str. 4<br>71735 Eberdingen<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:{{ accent }}; margin-bottom:8px;\">{{ t.lPhone }}<\u002Fdiv>\n        <a href=\"tel:070423743267\" style=\"font-size:15px; color:{{ text }};\" style-hover=\"color:{{ accent }}\">07042 374 32 67<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:{{ accent }}; margin-bottom:8px;\">{{ t.lEmail }}<\u002Fdiv>\n        <a href=\"mailto:info@orca.gmbh\" style=\"font-size:15px; color:{{ text }};\" style-hover=\"color:{{ accent }}\">info@orca.gmbh<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:{{ accent }}; margin-bottom:8px;\">{{ t.lHours }}<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.7; color:{{ textMuted }};\">{{ t.hoursValue }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:{{ accent }}; margin-bottom:8px;\">Instagram<\u002Fdiv>\n        <a href=\"https://www.instagram.com/orca.restoration/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-size:15px; color:{{ text }};\" style-hover=\"color:{{ accent }}\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" style=\"vertical-align:-2px; margin-right:6px; fill:none; stroke:currentColor; stroke-width:1.9\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.2\" cy=\"6.8\" r=\"1.15\" style=\"fill:currentColor; stroke:none\"><\u002Fcircle><\u002Fsvg>@orca.restoration<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-top:1px solid {{ line }};\">\n    <div data-cookie-map=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2622.857901638274!2d8.936827976350775!3d48.899045197844856!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47977d3aac5a64c5%3A0xc3e8d3362327b112!2sORCA%20Restoration%20GmbH!5e0!3m2!1sde!2sde!4v1702660735657!5m2!1sde!2sde\" style=\"width:100%; height:420px;\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:56px 56px 40px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px 48px; font-size:13px; color:{{ textMuted }};\">\n    <div style=\"font-family:'Cormorant Garamond',serif; font-size:18px; letter-spacing:0.08em; color:{{ text }};\">ORCA Restoration GmbH<\u002Fdiv>\n    <div>Robert-Bosch-Str. 4, 71735 Eberdingen<\u002Fdiv>\n    <div><a href=\"tel:070423743267\" class=\"link-fade\" style=\"color:{{ accent }};\" style-hover=\"color:{{ text }}\">07042 374 32 67<\u002Fa> · <a href=\"mailto:info@orca.gmbh\" class=\"link-fade\" style=\"color:{{ accent }};\" style-hover=\"color:{{ text }}\">info@orca.gmbh<\u002Fa> · <a href=\"https://www.instagram.com/orca.restoration/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"link-fade\" style=\"color:{{ accent }};\" style-hover=\"color:{{ text }}\"><svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" style=\"vertical-align:-2px; margin-right:6px; fill:none; stroke:currentColor; stroke-width:1.9\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.2\" cy=\"6.8\" r=\"1.15\" style=\"fill:currentColor; stroke:none\"><\u002Fcircle><\u002Fsvg>Instagram<\u002Fa><\u002Fdiv>\n    <div><a href=\"./Legal.html\" class=\"link-fade\" style=\"color:{{ textMuted }};\" style-hover=\"color:{{ accent }}\">Impressum<\u002Fa> · © 2026 ORCA Restoration GmbH<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bg&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#f6f3ee&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#1b1a17&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;textMuted&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#6b6560&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#ddd7cc&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7a2331&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#7a2331&quot;,&quot;#8a6a3d&quot;,&quot;#2f3b2f&quot;,&quot;#3a3f45&quot;]}}\">\nconst DICT = {\n  de: {\n    navStart: 'Start', navAbout: 'Über uns', navProjects: 'Projekte', navContact: 'Kontakt',\n    pageTitle: 'Lassen Sie uns über Ihr Projekt sprechen',\n    fName: 'Name', fEmail: 'E-Mail', fVehicle: 'Fahrzeug', fMessage: 'Nachricht', fSend: 'Senden',\n    lAddress: 'Adresse', lPhone: 'Telefon', lEmail: 'E-Mail',\n    lHours: 'Öffnungszeiten', hoursValue: 'Besuche nach Vereinbarung',\n  },\n  en: {\n    navStart: 'Home', navAbout: 'About', navProjects: 'Projects', navContact: 'Contact',\n    pageTitle: \"Let's talk about your project\",\n    fName: 'Name', fEmail: 'Email', fVehicle: 'Vehicle', fMessage: 'Message', fSend: 'Send',\n    lAddress: 'Address', lPhone: 'Phone', lEmail: 'Email',\n    lHours: 'Opening hours', hoursValue: 'Visits by appointment',\n  },\n  fr: {\n    navStart: 'Accueil', navAbout: 'À propos', navProjects: 'Projets', navContact: 'Contact',\n    pageTitle: 'Parlons de votre projet',\n    fName: 'Nom', fEmail: 'E-mail', fVehicle: 'Véhicule', fMessage: 'Message', fSend: 'Envoyer',\n    lAddress: 'Adresse', lPhone: 'Téléphone', lEmail: 'E-mail',\n    lHours: 'Horaires', hoursValue: 'Visites sur rendez-vous',\n  },\n};\n\nclass Component extends DCLogic {\n  state = { lang: 'de' };\n  renderVals() {\n    const lang = this.state.lang;\n    const accent = this.props.accent ?? '#7a2331';\n    const textMuted = this.props.textMuted ?? '#6b6560';\n    return {\n      bg: this.props.bg ?? '#f6f3ee',\n      text: this.props.text ?? '#1b1a17',\n      textMuted,\n      line: this.props.line ?? '#ddd7cc',\n      accent,\n      t: DICT[lang],\n      langDeColor: lang === 'de' ? accent : textMuted,\n      langEnColor: lang === 'en' ? accent : textMuted,\n      langFrColor: lang === 'fr' ? accent : textMuted,\n      setLangDe: () => this.setState({ lang: 'de' }),\n      setLangEn: () => this.setState({ lang: 'en' }),\n      setLangFr: () => this.setState({ lang: 'fr' }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
